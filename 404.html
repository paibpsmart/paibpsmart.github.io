<body>
<main class="error-page" id="main">
<div class="container">
<article class="policy error-card" id="error-card">
<img alt="Logo SMP Negeri 1 Susukan" class="error-logo" height="220" src="/logo-spensus.png" width="224"/>
<h1 class="error-code" id="error-code">404</h1>
<h2 id="error-title">Halaman tidak ditemukan</h2>
<p id="error-text">Alamat yang Anda buka mungkin salah, sudah dipindahkan, atau tidak tersedia.</p>
<a class="btn" href="/">Kembali ke Beranda</a>
</article>
</div>
</main>
<script>
(async()=>{
  if(!/\/reset-cache-v\d+\.html$/i.test(location.pathname)) return;
  document.getElementById('error-code').textContent='✓';
  document.getElementById('error-title').textContent='Memulihkan PAIBP SMART';
  document.getElementById('error-text').textContent='Membersihkan koneksi kelas dan sesi CAT lama…';
  document.querySelector('#error-card a')?.remove();
  const stale=/paibp-smart-(?:cat|class-context|student-session|policy-cache|focus-session)/i;
  for(const store of [localStorage,sessionStorage]){
    try{for(let i=store.length-1;i>=0;i--){const k=store.key(i)||'';if(k!=='paibp-smart-student-identity-v1'&&stale.test(k))store.removeItem(k)}}catch{}
  }
  try{for(const k of await caches.keys())await caches.delete(k)}catch{}
  try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch{}
  document.getElementById('error-text').textContent='Sesi lama sudah dibersihkan. Membuka versi terbaru…';
  setTimeout(()=>location.replace('/index.html?reset=1&v=69&t='+Date.now()),600);
})();
</script>
<script src="v29-ui.js?v=37"></script><script src="v30-ui.js?v=37"></script><script src="icon-art-v85.js?v=85" defer></script></body>
