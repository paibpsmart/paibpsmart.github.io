name: Verify full sync V126

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-sync-v126.yml'
  workflow_run:
    workflows: ['Bootstrap PAIBP D1 V126']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: End-to-end API verification
        shell: bash
        env:
          API: https://paibp-smart-api.sunarso29.workers.dev
          ORIGIN: https://paibpsmart.github.io
          READ_KEY: b082937b2165453ba7d9f81ecac063b00310b339ec0643da
        run: |
          set -euo pipefail
          TEST_ID="v126-e2e-$(date +%s)-$RANDOM"
          CONTENT_KEY="verify:${TEST_ID}"
          STALE_ID='v126-e2e-1786538496-32663'
          STALE_CONTENT="verify:${STALE_ID}"
          export TEST_ID CONTENT_KEY

          post() {
            local action="$1" data="$2"
            curl -fsS "$API/" \
              -H "Origin: $ORIGIN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data "$(jq -nc --arg action "$action" --arg readKey "$READ_KEY" --argjson data "$data" '{app:"paibp-smart",version:"126",action:$action,readKey:$readKey,data:$data}')"
          }

          delete_with_retry() {
            local action="$1" data="$2"
            for attempt in 1 2 3 4; do
              if post "$action" "$data" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }

          cleanup() {
            set +e
            delete_with_retry contentDelete "$(jq -nc --arg key "$CONTENT_KEY" '{key:$key}')"
            delete_with_retry newsDelete "$(jq -nc --arg id "$TEST_ID" '{id:$id}')"
          }
          trap cleanup EXIT

          echo '0/9 remove stale E2E residue from interrupted verification'
          delete_with_retry contentDelete "$(jq -nc --arg key "$STALE_CONTENT" '{key:$key}')" || true
          delete_with_retry newsDelete "$(jq -nc --arg id "$STALE_ID" '{id:$id}')" || true

          echo '1/9 health'
          curl -fsS "$API/health" -H "Origin: $ORIGIN" | tee /tmp/health.json
          jq -e '.ok == true and .version == "126-d1" and .database == "Cloudflare D1" and .schema == "126"' /tmp/health.json >/dev/null

          echo '2/9 CORS preflight'
          curl -sS -D /tmp/cors.h -o /dev/null -X OPTIONS "$API/" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type,Accept'
          grep -qi "^access-control-allow-origin: $ORIGIN" /tmp/cors.h
          grep -qi '^access-control-allow-methods:.*POST' /tmp/cors.h

          echo '3/9 contentUpsert'
          CONTENT_DATA="$(jq -nc --arg key "$CONTENT_KEY" --arg id "$TEST_ID" '{key:$key,value:{schema:"verify-v126",id:$id,text:"sinkronisasi konten editor"},authorName:"PAIBP SMART E2E",authorSchool:"SMP Negeri 1 Susukan"}')"
          post contentUpsert "$CONTENT_DATA" | tee /tmp/content-upsert.json
          jq -e '.ok == true' /tmp/content-upsert.json >/dev/null

          echo '4/9 newsUpsert'
          NEWS_DATA="$(jq -nc --arg id "$TEST_ID" '{id:$id,title:"Verifikasi Sinkronisasi V126",date:"2026-08-12",summary:"Data uji otomatis yang akan dihapus.",authorName:"PAIBP SMART E2E",authorSchool:"SMP Negeri 1 Susukan",isPublished:true,sortOrder:999999}')"
          post newsUpsert "$NEWS_DATA" | tee /tmp/news-upsert.json
          jq -e '.ok == true' /tmp/news-upsert.json >/dev/null

          echo '5/9 publicSnapshot read-back + public security'
          curl -fsS "$API/?action=publicSnapshot" -H "Origin: $ORIGIN" -H 'Accept: application/json' | tee /tmp/snapshot.json >/dev/null
          jq -e --arg id "$TEST_ID" --arg key "$CONTENT_KEY" '.ok == true and any(.news[]?; .id == $id) and (.content[$key].id == $id) and all(.news[]?; (has("readKey")|not) and (has("token")|not) and (has("authorization")|not))' /tmp/snapshot.json >/dev/null

          echo '6/9 editorSnapshot read-back with transient retry'
          EDITOR_OK=0
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$API/?action=editorSnapshot&readKey=$READ_KEY" -H "Origin: $ORIGIN" -H 'Accept: application/json' > /tmp/editor.json; then
              if jq -e '.ok == true and (.public.ok == true) and (.activities|type == "array") and (.submissions|type == "array")' /tmp/editor.json >/dev/null; then
                EDITOR_OK=1
                break
              fi
            fi
            sleep 1
          done
          test "$EDITOR_OK" = 1

          echo '7/9 delete test records'
          delete_with_retry newsDelete "$(jq -nc --arg id "$TEST_ID" '{id:$id}')"
          delete_with_retry contentDelete "$(jq -nc --arg key "$CONTENT_KEY" '{key:$key}')"

          echo '8/9 verify cleanup and stale residue removal'
          curl -fsS "$API/?action=publicSnapshot" -H "Origin: $ORIGIN" -H 'Accept: application/json' > /tmp/final.json
          jq -e --arg id "$TEST_ID" --arg stale "$STALE_ID" --arg key "$CONTENT_KEY" --arg staleKey "$STALE_CONTENT" '([.news[]? | select(.id == $id or .id == $stale)] | length) == 0 and (.content[$key] == null) and (.content[$staleKey] == null) and all(.news[]?; (has("readKey")|not) and (has("token")|not))' /tmp/final.json >/dev/null

          echo '9/9 completed'
          trap - EXIT

          cat > LIVE-SYNC-STATUS-V126.txt <<EOF
          PAIBP SMART FULL SYNC V126
          Verified UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Domain: https://paibpsmart.github.io/
          API Worker: paibp-smart-api
          Backend: Cloudflare D1
          Schema: 126
          CORS new domain: PASS
          API health: PASS
          contentUpsert -> publicSnapshot: PASS
          newsUpsert -> publicSnapshot: PASS
          Public payload security: PASS
          editorSnapshot: PASS
          newsDelete/contentDelete cleanup: PASS
          Previous interrupted test residue: REMOVED
          Current test residue: NONE
          Overall: PASS
          EOF
          cat LIVE-SYNC-STATUS-V126.txt

      - name: Commit verified status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PAIBP SMART Sync Verification'
          git config user.email 'actions@users.noreply.github.com'
          git add LIVE-SYNC-STATUS-V126.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V126 sinkronisasi berita editor database terverifikasi'
          git pull --rebase origin main
          git push origin HEAD:main
