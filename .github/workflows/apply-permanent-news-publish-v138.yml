name: Apply permanent news publish architecture V138

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-permanent-news-publish-v138.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: apply-permanent-news-v138
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch server-truth publication core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('news-editor-chunked-v102.js')
          s=p.read_text(encoding='utf-8')
          pat=r'  async function post\(action,data\)\{.*?\n  \}\n\n  async function verify\(id\)\{.*?\n  \}\n'
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('publish post/verify block not found')
          new=(
          '  async function post(action,data){\n'
          '    const body=JSON.stringify({action,readKey:KEY,key:KEY,data:{...data,readKey:KEY},origin:location.origin});\n'
          '    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),22000);\n'
          '    try{\n'
          '      const r=await fetch(PROXY,{method:"POST",cache:"no-store",headers:{"Content-Type":"text/plain;charset=UTF-8","Accept":"application/json"},body,signal:ctl.signal});\n'
          '      const text=await r.text();let j={};try{j=JSON.parse(text)}catch{throw new Error("Respons server tidak valid.")}\n'
          '      if(!r.ok||j?.ok!==true)throw new Error(j?.error||`Server HTTP ${r.status}`);\n'
          '      return j;\n'
          '    }catch(e){\n'
          '      if(e?.name==="AbortError")throw new Error("Server tidak merespons dalam batas waktu.");\n'
          '      throw new Error(e?.message||"Penyimpanan server gagal.");\n'
          '    }finally{clearTimeout(timer)}\n'
          '  }\n\n'
          '  async function verify(id,expectedTitle=""){\n'
          '    for(const ms of [450,800,1200,1800,2600,3800,5200,7000,9000]){\n'
          '      await sleep(ms);\n'
          '      try{\n'
          '        const j=await jsonpSnapshot(),row=(j?.news||[]).find(n=>String(n.id)===String(id)),manifest=j?.content?.[`news:${id}`];\n'
          '        const coverKey=manifest?.coverKey||(Array.isArray(manifest?.photoKeys)?manifest.photoKeys[0]:"");\n'
          '        const cover=coverKey?j?.content?.[coverKey]:null;\n'
          '        const titleOk=!expectedTitle||String(row?.title||"")===String(expectedTitle);\n'
          '        if(j?.ok===true&&row&&row.isPublished!==false&&titleOk&&manifest&&String(manifest?.id||id)===String(id)&&coverKey&&cover)return{snapshot:j,row,manifest,cover};\n'
          '      }catch{}\n'
          '    }\n'
          '    return null;\n'
          '  }\n')
          s=s[:m.start()]+new+s[m.end():]
          s=s.replace('const verified=await verify(x.id);if(!verified)','const verified=await verify(x.id,x.title);if(!verified)')
          if 'verify(x.id,x.title)' not in s: raise SystemExit('verified publish gate not patched')
          if 'mode:"no-cors"' in s: raise SystemExit('opaque no-cors fallback remains')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Replace redirect helper with confirmed-success gate
        shell: bash
        run: |
          set -euo pipefail
          cat > news-publish-direct-v114.js <<'EOF'
          (()=>{
          "use strict";
          if(window.__NEWS_PUBLISH_DIRECT_V138__)return;window.__NEWS_PUBLISH_DIRECT_V138__=1;
          const $=(s,r=document)=>r.querySelector(s);
          const editorStatus=$("#ne-editor-status"),formStatus=$("#ne-form-status"),mediaStatus=$("#nea-status"),mediaProgress=$("#nea-progress");
          let redirecting=false;
          function serverConfirmed(){
            return String(editorStatus?.textContent||"").trim()==="Tayang" && /^Berhasil\./i.test(String(formStatus?.textContent||"").trim());
          }
          function goHome(){
            if(redirecting||!serverConfirmed())return;redirecting=true;
            const id=$("#ne-id")?.value||"";
            if(mediaProgress)mediaProgress.style.display="none";
            if(mediaStatus)mediaStatus.textContent="Berita telah dikonfirmasi server.";
            try{new BroadcastChannel("spensus-news").postMessage({type:"published",id,source:"server-confirmed-v138"})}catch{}
            const u=new URL("index.html",document.baseURI);u.searchParams.set("published",id||"1");u.searchParams.set("v","138");
            setTimeout(()=>location.replace(u.href),180);
          }
          const observer=new MutationObserver(goHome);
          [editorStatus,formStatus].filter(Boolean).forEach(el=>observer.observe(el,{subtree:true,childList:true,characterData:true}));
          goHome();
          })();
          EOF

      - name: Make public news server-truth only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('home-news-v102.js');s=p.read_text(encoding='utf-8')
          if 'spensus-news-ig-cache-v102' not in s: raise SystemExit('cache key not found')
          s=s.replace('spensus-news-ig-cache-v102','spensus-news-ig-cache-v138-server-truth')
          if 'items=mergeRows(normalize(j),items)' not in s: raise SystemExit('server merge not found')
          s=s.replace('items=mergeRows(normalize(j),items)','items=normalize(j)')
          old='async function boot(){shell();const cached=readCache();if(cached.length){items=sortRows(cached);selectedId=items[0].id;render()}const local=await editorRows();if(local.length){items=mergeRows(local,items);selectedId=items[0].id;render()}if(!items.length)$("[data-ig-main]",shell()).innerHTML=\'<div class="ig-skeleton"></div>\';const bg=()=>fetchServer();if("requestIdleCallback" in window)requestIdleCallback(bg,{timeout:700});else setTimeout(bg,180)}'
          new='async function boot(){shell();const cached=readCache();if(cached.length){items=sortRows(cached);selectedId=items[0].id;render()}if(!items.length)$("[data-ig-main]",shell()).innerHTML=\'<div class="ig-skeleton"></div>\';const bg=()=>fetchServer();if("requestIdleCallback" in window)requestIdleCallback(bg,{timeout:700});else setTimeout(bg,180)}'
          if old not in s: raise SystemExit('local boot merge not found')
          s=s.replace(old,new)
          old='try{new BroadcastChannel("spensus-news").addEventListener("message",async()=>{const local=await editorRows();if(local.length){items=mergeRows(local,items);selectedId=items[0].id;render()}setTimeout(fetchServer,180)})}catch{}'
          new='try{new BroadcastChannel("spensus-news").addEventListener("message",()=>{setTimeout(fetchServer,180)})}catch{}'
          if old not in s: raise SystemExit('local broadcast merge not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Bump permanent client versions and keep dynamic Worker sharing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('home-share-v133.js');s=p.read_text(encoding='utf-8').replace('__SPENSUS_SHARE_V137__','__SPENSUS_SHARE_V138__')
          if 'new URL(`?id=${encodeURIComponent(String(id||""))}`,SHARE_WORKER)' not in s: raise SystemExit('dynamic Worker share URL missing')
          if 'share-v136/${encodeURIComponent' in s: raise SystemExit('static share URL still active')
          p.write_text(s,encoding='utf-8')
          p=Path('icon-art-v85.js');s=p.read_text(encoding='utf-8')
          s=s.replace('addScript("home-news-v102.js","102")','addScript("home-news-v102.js","138")')
          s=s.replace('addScript("home-share-v133.js","137")','addScript("home-share-v133.js","138")')
          s=s.replace('service-worker.js?v=137','service-worker.js?v=138');p.write_text(s,encoding='utf-8')
          p=Path('index.html');s=p.read_text(encoding='utf-8').replace('icon-art-v85.js?v=137','icon-art-v85.js?v=138');p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js');s=p.read_text(encoding='utf-8').replace('paibp-smart-v137-share-worker-r1','paibp-smart-v138-server-truth-share-r1').replace('icon-art-v85.js?v=137','icon-art-v85.js?v=138');p.write_text(s,encoding='utf-8')
          p=Path('editor-berita.html');s=p.read_text(encoding='utf-8').replace('news-editor-chunked-v102.js?v=118','news-editor-chunked-v102.js?v=138').replace('news-publish-direct-v114.js?v=118','news-publish-direct-v114.js?v=138').replace('Tekan Posting satu kali; setelah data utama tersimpan halaman langsung kembali ke beranda.','Tekan Posting satu kali; halaman kembali ke beranda hanya setelah seluruh data dan sampul dikonfirmasi server.');p.write_text(s,encoding='utf-8')
          PY

      - name: Verify invariants and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F '__NEWS_PUBLISH_DIRECT_V138__' news-publish-direct-v114.js
          grep -F 'verify(x.id,x.title)' news-editor-chunked-v102.js
          ! grep -F 'mode:"no-cors"' news-editor-chunked-v102.js
          grep -F 'spensus-news-ig-cache-v138-server-truth' home-news-v102.js
          ! grep -F 'items=mergeRows(normalize(j),items)' home-news-v102.js
          ! grep -F 'const local=await editorRows()' home-news-v102.js
          grep -F 'home-share-v133.js","138"' icon-art-v85.js
          grep -F 'icon-art-v85.js?v=138' index.html
          git add news-editor-chunked-v102.js news-publish-direct-v114.js home-news-v102.js home-share-v133.js icon-art-v85.js index.html service-worker.js editor-berita.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'V138 permanent server-truth publishing and social preview'
            git push origin HEAD:main
          fi

      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
