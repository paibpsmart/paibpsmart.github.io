name: Verify live V132 clean share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-v118.yml'
      - 'home-share-v102.js'
      - 'icon-art-v85.js'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for GitHub Pages deploy
        run: sleep 35
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.58.2 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify clean PAIBP SMART share URL
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const { chromium } = require('playwright');
            const id='news-1786463411888-925mqh8';
            const expected=`https://paibpsmart.github.io/index.html?news=${encodeURIComponent(id)}&from=share#kabar-spensus`;
            const pageUrl=`https://paibpsmart.github.io/index.html?ui=132#kabar-spensus`;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(pageUrl,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector(`.ig-post[data-post="${id}"]`,{timeout:45000});
            const post=page.locator(`.ig-post[data-post="${id}"]`);
            await post.locator('[data-share]').click();
            await page.waitForSelector('#ig-share-modal-v132:not([hidden])',{timeout:10000});
            const out=await page.evaluate(()=>{
              const input=document.querySelector('#ig-share-link');
              const buttons=[...document.querySelectorAll('#ig-share-modal-v132 [data-external]')];
              const scripts=[...document.scripts].map(s=>s.src).filter(Boolean);
              return {
                value:input?.value||'',
                modal:Boolean(document.querySelector('#ig-share-modal-v132:not([hidden])')),
                scripts:scripts.filter(x=>/home-share-v102/.test(x)),
                externalCount:buttons.length
              };
            });
            console.log('CLEAN_SHARE_RESULT',JSON.stringify(out,null,2));
            if(!out.modal)throw new Error('Modal share V132 tidak aktif');
            if(out.value!==expected)throw new Error(`URL share salah: ${out.value}`);
            if(out.value.includes('workers.dev'))throw new Error('URL publik masih memakai workers.dev');
            if(!out.value.startsWith('https://paibpsmart.github.io/'))throw new Error('URL publik bukan domain PAIBP SMART');
            const deep=await browser.newPage({viewport:{width:390,height:844}});
            await deep.goto(expected,{waitUntil:'domcontentloaded',timeout:60000});
            await deep.waitForSelector(`.ig-post[data-post="${id}"]`,{timeout:45000});
            const title=await deep.locator(`.ig-post[data-post="${id}"] .ig-title`).textContent();
            console.log('DEEPLINK_TITLE',title?.trim());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
