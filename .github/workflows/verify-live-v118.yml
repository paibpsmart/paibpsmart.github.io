name: Verify live V132 clean share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-v118.yml'
      - 'home-share-v102.js'
      - 'icon-art-v85.js'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for GitHub Pages deploy
        run: sleep 25
      - name: Verify deployed clean share script
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://paibpsmart.github.io/home-share-v102.js?v=132' -o /tmp/share.js
          curl -fsSL 'https://paibpsmart.github.io/icon-art-v85.js?v=132' -o /tmp/loader.js
          curl -fsSL 'https://paibpsmart.github.io/service-worker.js?v=132' -o /tmp/sw.js
          grep -F 'const SITE="https://paibpsmart.github.io/"' /tmp/share.js
          grep -F 'const SHARE_WORKER="https://paibp-smart-share.sunarso29.workers.dev/"' /tmp/share.js
          grep -F 'function shareUrl(id){const u=new URL("index.html",SITE)' /tmp/share.js
          grep -F 'u.searchParams.set("news",String(id||""))' /tmp/share.js
          grep -F 'u.searchParams.set("from","share")' /tmp/share.js
          grep -F 'u.hash="kabar-spensus"' /tmp/share.js
          grep -F 'addScript("home-share-v102.js","132")' /tmp/loader.js
          grep -F 'paibp-smart-v132-share-domain-r1' /tmp/sw.js
          if grep -F 'function shareUrl(id){const u=new URL(SHARE_WORKER)' /tmp/share.js; then
            echo 'FAIL: public share URL still points to Worker'
            exit 1
          fi
          echo 'PASS: public sharing uses https://paibpsmart.github.io/'
