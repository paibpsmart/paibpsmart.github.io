name: Audit legacy URL V127
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-legacy-url-v127.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit old and new URLs
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://sunarso29.github.io/paibp-smart'
          NEW='https://paibpsmart.github.io'
          : > LEGACY-URL-AUDIT-V127.txt
          for path in '/' '/index.html' '/index.html?news=test-legacy&from=share#kabar-spensus' '/akses-guru.html' '/path-yang-tidak-ada'; do
            echo "=== OLD $path ===" | tee -a LEGACY-URL-AUDIT-V127.txt
            curl -sS -I -L --max-redirs 5 -o /tmp/h -w 'initial_or_final_http=%{http_code}\nfinal_url=%{url_effective}\nredirects=%{num_redirects}\n' "$OLD$path" | tee -a LEGACY-URL-AUDIT-V127.txt
            sed -n '1,25p' /tmp/h | tee -a LEGACY-URL-AUDIT-V127.txt
          done
          echo '=== NEW ROOT ===' | tee -a LEGACY-URL-AUDIT-V127.txt
          curl -sS -I -L --max-redirs 5 -o /tmp/newh -w 'http=%{http_code}\nfinal_url=%{url_effective}\nredirects=%{num_redirects}\n' "$NEW/" | tee -a LEGACY-URL-AUDIT-V127.txt
          sed -n '1,25p' /tmp/newh | tee -a LEGACY-URL-AUDIT-V127.txt
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'PAIBP SMART Legacy Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add LEGACY-URL-AUDIT-V127.txt
          git commit -m 'V127 catat status live URL lama' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
