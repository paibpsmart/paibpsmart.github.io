name: Harden public API V126

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-public-api-v126.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Strip internal auth fields from public news payload
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloudflare/api-worker/src/index.js')
          s=p.read_text(encoding='utf-8')
          old='''function newsObject(row) {\n  const payload = safeParse(row.payload_json, {}) || {};\n  return {'''
          new='''function newsObject(row) {\n  const payload = safeParse(row.payload_json, {}) || {};\n  for (const secretField of ["readKey","token","auth","authorization","apiKey","origin"]) delete payload[secretField];\n  return {'''
          if old not in s:
              if 'for (const secretField of ["readKey"' in s:
                  print('Public payload hardening already applied.')
              else:
                  raise SystemExit('Target newsObject block not found')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Public payload hardening applied.')
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PAIBP SMART Security'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/api-worker/src/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V126 cegah kunci internal tampil di snapshot publik'
          git pull --rebase origin main
          git push origin HEAD:main
