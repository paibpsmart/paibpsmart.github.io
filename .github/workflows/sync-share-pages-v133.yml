name: Permanent GitHub Pages social previews V141

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'home-share-v133.js'
      - '.github/workflows/sync-share-pages-v133.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: permanent-github-pages-social-preview-v141
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce public share URL standard
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const SHARE_BASE="https://paibpsmart.github.io/share/"' home-share-v133.js
          grep -F 'return `${SHARE_BASE}${encodeURIComponent(String(id||""))}/`' home-share-v133.js
          ! grep -F 'workers.dev' home-share-v133.js
          ! grep -F 'sunarso29' home-share-v133.js
          echo 'PASS: every client share URL is paibpsmart.github.io/share/<id>/.'

      - name: Fetch all published news from D1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://paibp-smart-api.sunarso29.workers.dev/?action=publicSnapshot' \
            -H 'Origin: https://paibpsmart.github.io' \
            -H 'Accept: application/json' \
            -o /tmp/snapshot.json
          jq -e '.ok == true and (.news | type == "array") and (.content | type == "object")' /tmp/snapshot.json >/dev/null
          test "$(jq '[.news[] | select(.isPublished != false)] | length' /tmp/snapshot.json)" -gt 0

      - name: Install image converter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/previewgen
          cd /tmp/previewgen
          npm init -y >/dev/null 2>&1
          npm i sharp@0.34.3 >/dev/null 2>&1

      - name: Generate permanent per-post GitHub Pages previews
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const sharp=require('/tmp/previewgen/node_modules/sharp');
          const s=JSON.parse(fs.readFileSync('/tmp/snapshot.json','utf8'));
          const news=(Array.isArray(s.news)?s.news:[]).filter(n=>n&&n.isPublished!==false&&n.id&&n.title);
          const content=s.content&&typeof s.content==='object'?s.content:{};
          fs.rmSync('share',{recursive:true,force:true});
          fs.rmSync('share-images',{recursive:true,force:true});
          fs.mkdirSync('share',{recursive:true});
          fs.mkdirSync('share-images',{recursive:true});
          const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const clean=v=>String(v??'').replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim();
          function unwrap(v){let x=v;for(let i=0;i<8;i++){if(x&&typeof x==='object'&&Object.prototype.hasOwnProperty.call(x,'value')){x=x.value;continue}if(typeof x==='string'){const t=x.trim();if((t.startsWith('{')&&t.endsWith('}'))||(t.startsWith('[')&&t.endsWith(']'))){try{x=JSON.parse(t);continue}catch{}}}break}return x}
          function dataUriBuffer(uri){const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(String(uri||''));if(!m)return null;return m[2]?Buffer.from(m[3]||'','base64'):Buffer.from(decodeURIComponent(m[3]||''));}
          function actualCover(n){
            const rawId=String(n.id||'');
            const manifest=unwrap(content[`news:${rawId}`])||{};
            const key=manifest.coverKey||(Array.isArray(manifest.photoKeys)&&manifest.photoKeys[0])||'';
            const photo=key?unwrap(content[key]):null;
            const src=photo&&typeof photo==='object'?(photo.data||photo.src||photo.url||''):photo;
            return {manifest,key,src:String(src||manifest.coverDataUrl||manifest.coverUrl||n.imageUrl||n.imageDataUrl||'')};
          }
          async function loadCover(src){
            const d=dataUriBuffer(src);if(d&&d.length)return d;
            if(/^https:\/\//i.test(src)){const r=await fetch(src,{headers:{Accept:'image/*','User-Agent':'PAIBP-SMART-PreviewGenerator/141'},cache:'no-store'});if(!r.ok)throw new Error(`cover URL HTTP ${r.status}`);return Buffer.from(await r.arrayBuffer())}
            const fallback=fs.existsSync('gerbang.jpg')?fs.readFileSync('gerbang.jpg'):null;
            if(fallback&&fallback.length)return fallback;
            throw new Error('cover kosong dan fallback tidak tersedia');
          }
          (async()=>{
            for(const n of news){
              const rawId=clean(n.id),id=rawId.replace(/[^A-Za-z0-9._-]/g,'_').slice(0,180);if(!id)continue;
              const c=actualCover(n);
              const title=clean(c.manifest?.title||n.title).slice(0,300);
              const desc=clean(c.manifest?.summary||n.summary||n.description||'Kabar terbaru SMP Negeri 1 Susukan.').slice(0,340);
              const buf=await loadCover(c.src);
              if(buf.length<1000)throw new Error(`${rawId}: cover terlalu kecil (${buf.length})`);
              const imagePath=`share-images/${id}.jpg`;
              await sharp(buf).rotate().resize(1200,630,{fit:'cover',position:'centre'}).jpeg({quality:90,mozjpeg:true}).toFile(imagePath);
              const stat=fs.statSync(imagePath);if(stat.size<5000)throw new Error(`${rawId}: JPEG terlalu kecil (${stat.size})`);
              const dir=`share/${id}`;fs.mkdirSync(dir,{recursive:true});
              const share=`https://paibpsmart.github.io/share/${encodeURIComponent(id)}/`;
              const target=`https://paibpsmart.github.io/index.html?news=${encodeURIComponent(rawId)}&from=share#kabar-spensus`;
              const image=`https://paibpsmart.github.io/share-images/${encodeURIComponent(id)}.jpg`;
              const html=`<!doctype html>\n<html lang="id">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${esc(title)} | SMP Negeri 1 Susukan</title>\n<meta name="description" content="${esc(desc)}">\n<meta name="robots" content="index,follow,max-image-preview:large">\n<meta property="og:type" content="article">\n<meta property="og:locale" content="id_ID">\n<meta property="og:site_name" content="SMP Negeri 1 Susukan">\n<meta property="og:title" content="${esc(title)}">\n<meta property="og:description" content="${esc(desc)}">\n<meta property="og:url" content="${esc(share)}">\n<meta property="og:image" content="${esc(image)}">\n<meta property="og:image:url" content="${esc(image)}">\n<meta property="og:image:secure_url" content="${esc(image)}">\n<meta property="og:image:type" content="image/jpeg">\n<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">\n<meta property="og:image:alt" content="Sampul ${esc(title)}">\n<link rel="image_src" href="${esc(image)}">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="${esc(title)}">\n<meta name="twitter:description" content="${esc(desc)}">\n<meta name="twitter:image" content="${esc(image)}">\n<link rel="canonical" href="${esc(share)}">\n<meta http-equiv="refresh" content="0;url=${esc(target)}">\n</head>\n<body>\n<img src="${esc(image)}" alt="Sampul ${esc(title)}" width="1200" height="630">\n<h1>${esc(title)}</h1>\n<p>${esc(desc)}</p>\n<p><a href="${esc(target)}">Buka berita di SMP Negeri 1 Susukan</a></p>\n<script>window.location.replace(${JSON.stringify(target)});<\/script>\n</body>\n</html>\n`;
              fs.writeFileSync(path.join(dir,'index.html'),html);
              console.log(`GENERATED ${share} image=${stat.size} bytes coverKey=${c.key||'(fallback)'}`);
            }
            fs.writeFileSync('share/.generated-v141',new Date().toISOString()+`\nposts=${news.length}\n`);
            console.log(`Generated ${news.length} permanent GitHub Pages preview(s).`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit generated previews
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A share share-images
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V141 sync permanent social previews from D1'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true

      - name: Verify current preview on paibpsmart.github.io
        shell: bash
        run: |
          set -euo pipefail
          ID="$(jq -r '.news[] | select(.isPublished != false) | .id' /tmp/snapshot.json | head -n1)"
          TITLE="$(jq -r --arg id "$ID" '.news[] | select(.id==$id) | .title' /tmp/snapshot.json)"
          PAGE="https://paibpsmart.github.io/share/${ID}/"
          IMG="https://paibpsmart.github.io/share-images/${ID}.jpg"
          ok=0
          for i in $(seq 1 24); do
            if curl -fsSL -A 'WhatsApp/2.24.0' "${PAGE}?probe=$RANDOM" -o /tmp/social.html \
              && grep -F '<meta property="og:url" content="https://paibpsmart.github.io/share/' /tmp/social.html >/dev/null \
              && grep -F '<meta property="og:image" content="https://paibpsmart.github.io/share-images/' /tmp/social.html >/dev/null \
              && python - "$TITLE" <<'PY'
          import html,sys
          title=html.escape(sys.argv[1], quote=True)
          body=open('/tmp/social.html',encoding='utf-8').read()
          raise SystemExit(0 if title in body else 1)
          PY
            then
              if curl -fsSL -A 'WhatsApp/2.24.0' "${IMG}?probe=$RANDOM" -o /tmp/social.jpg && test "$(wc -c < /tmp/social.jpg)" -gt 5000; then ok=1; break; fi
            fi
            sleep 8
          done
          test "$ok" = 1
          file /tmp/social.jpg | grep -Ei 'JPEG|image'
          ! grep -F 'workers.dev' /tmp/social.html
          ! grep -F 'sunarso29' /tmp/social.html
          echo "PASS: ${PAGE} has the D1 title and 1200x630 cover on the GitHub Pages hostname."
