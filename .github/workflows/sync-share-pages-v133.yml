# Permanent guard: do not generate or rewrite per-post share pages.
name: Social preview permanent regression guard V139

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'home-share-v133.js'
      - 'home-news-v102.js'
      - 'news-editor-chunked-v102.js'
      - 'news-publish-direct-v114.js'
      - 'cloudflare/share-worker/**'
      - 'cloudflare/api-worker/**'
      - '.github/workflows/sync-share-pages-v133.yml'

permissions:
  contents: read

concurrency:
  group: social-preview-regression-v139
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Enforce permanent architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SHARE_WORKER="https://paibp-smart-share.sunarso29.workers.dev/"' home-share-v133.js
          grep -F 'new URL(`?id=${encodeURIComponent(String(id||""))}`,SHARE_WORKER)' home-share-v133.js
          ! grep -Eq 'share-v13[0-9]/\$\{encodeURIComponent' home-share-v133.js
          ! grep -F 'editorRows();if(local.length){items=mergeRows(local,items)' home-news-v102.js
          ! grep -F 'items=mergeRows(normalize(j),items)' home-news-v102.js
          ! grep -F 'isVerifyText' news-publish-direct-v114.js
          grep -F 'Memastikan berita sudah benar-benar tayang' news-editor-chunked-v102.js
          grep -F 'async function publicNews(env, id)' cloudflare/api-worker/src/index.js
          grep -F 'async function directPost(id)' cloudflare/share-worker/src/index.js
          echo 'PASS: permanent architecture invariants hold.'

      - name: Verify direct D1 API and social preview end-to-end
        shell: bash
        run: |
          set -euo pipefail
          API='https://paibp-smart-api.sunarso29.workers.dev'
          WORKER='https://paibp-smart-share.sunarso29.workers.dev'
          ORIGIN='https://paibpsmart.github.io'

          curl -fsSL "${API}/health?probe=$RANDOM" -H "Origin: ${ORIGIN}" -o /tmp/api-health.json
          jq -e '.ok==true and (.version|startswith("139"))' /tmp/api-health.json >/dev/null
          curl -fsSL "${WORKER}/health?probe=$RANDOM" -o /tmp/share-health.json
          jq -e '.ok==true and (.version=="139")' /tmp/share-health.json >/dev/null

          curl -fsSL "${API}/?action=publicSnapshot&probe=$RANDOM" -H "Origin: ${ORIGIN}" -H 'Accept: application/json' -o /tmp/snapshot.json
          ID="$(jq -r '.news[] | select(.isPublished != false) | .id' /tmp/snapshot.json | head -n1)"
          test -n "$ID" && test "$ID" != 'null'
          TITLE="$(jq -r --arg id "$ID" '.news[] | select(.id==$id) | .title' /tmp/snapshot.json)"

          curl -fsSL "${API}/?action=publicNews&id=${ID}&probe=$RANDOM" -H "Origin: ${ORIGIN}" -H 'Accept: application/json' -o /tmp/public-news.json
          jq -e --arg id "$ID" --arg title "$TITLE" '.ok==true and .found==true and .news.id==$id and .news.title==$title' /tmp/public-news.json >/dev/null
          jq -e '.coverKey != null and .coverKey != "" and .cover != null' /tmp/public-news.json >/dev/null

          PAGE="${WORKER}/?id=${ID}&probe=$RANDOM"
          IMAGE="${WORKER}/image?id=${ID}&probe=$RANDOM"
          curl -fsSL -A 'WhatsApp/2.24.0' "$PAGE" -o /tmp/preview.html
          grep -F 'property="og:type" content="article"' /tmp/preview.html
          grep -F 'property="og:image"' /tmp/preview.html
          python - "$TITLE" <<'PY'
          import html,sys
          title=html.escape(sys.argv[1], quote=True)
          body=open('/tmp/preview.html',encoding='utf-8').read()
          if title not in body:
              raise SystemExit('Worker title does not match current D1 title')
          PY
          CODE="$(curl -sS -L -A 'WhatsApp/2.24.0' -o /tmp/cover.bin -w '%{http_code}' "$IMAGE")"
          test "$CODE" = '200'
          test "$(wc -c < /tmp/cover.bin)" -gt 1000
          file /tmp/cover.bin | grep -Ei 'image|jpeg|png|webp'
          echo "PASS: current D1 post $ID has matching metadata and fetchable cover through the permanent Worker path."
