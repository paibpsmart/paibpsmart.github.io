name: Bootstrap PAIBP D1 V126

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-d1-v126.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/api-worker
          npx --yes wrangler@latest d1 list --json > /tmp/d1-list.json
          DB_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/d1-list.json'))
          rows=data if isinstance(data,list) else data.get('result',data.get('databases',[]))
          for row in rows:
              if str(row.get('name','')) == 'paibp-smart-db':
                  print(row.get('uuid') or row.get('id') or row.get('database_id') or '')
                  break
          PY
          )"
          if [ -z "$DB_ID" ]; then
            echo 'Creating D1 paibp-smart-db in APAC...'
            npx --yes wrangler@latest d1 create paibp-smart-db --location=apac
            npx --yes wrangler@latest d1 list --json > /tmp/d1-list.json
            DB_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/d1-list.json'))
          rows=data if isinstance(data,list) else data.get('result',data.get('databases',[]))
          for row in rows:
              if str(row.get('name','')) == 'paibp-smart-db':
                  print(row.get('uuid') or row.get('id') or row.get('database_id') or '')
                  break
          PY
            )"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "D1 database id resolved."

      - name: Bind D1 in Wrangler
        shell: python
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          from pathlib import Path
          import os,re
          p=Path('cloudflare/api-worker/wrangler.toml')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n\[\[d1_databases\]\][\s\S]*?(?=\n\[\[|\Z)','',s).rstrip()+"\n"
          s += f'''\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "paibp-smart-db"\ndatabase_id = "{os.environ['DB_ID']}"\n'''
          p.write_text(s,encoding='utf-8')
          print(p.read_text())

      - name: Apply production schema
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/api-worker
          npx --yes wrangler@latest d1 execute paibp-smart-db --remote --file=schema.sql --yes
          npx --yes wrangler@latest d1 execute paibp-smart-db --remote --command "SELECT key,value FROM meta WHERE key='schema_version';"

      - name: Deploy API Worker with D1
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/api-worker
          npx --yes wrangler@latest deploy

      - name: Commit D1 binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PAIBP SMART D1 Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/api-worker/wrangler.toml
          if git diff --cached --quiet; then
            echo 'Binding already committed.'
            exit 0
          fi
          git commit -m 'V126 aktifkan database Cloudflare D1'
          git pull --rebase origin main
          git push origin HEAD:main
