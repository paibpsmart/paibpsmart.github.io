name: Hotfix V102 homepage news abort
on:
  push:
    paths:
      - '.github/workflows/hotfix-home-news-abort-v102.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch news fetch timeout and public error
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home-news-v102.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('setTimeout(()=>c.abort(),10000)','setTimeout(()=>c.abort(),30000)')
          old='catch(e){main.innerHTML=`<div class="sg-empty">${esc(e.message||"Berita belum dapat dimuat.")}</div>`}'
          new='catch(e){if(!items.length)main.innerHTML=`<div class="sg-loading">Kabar Spensus sedang disinkronkan…</div>`}'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'paibp-smart-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-news-v102.js
          git diff --cached --quiet && exit 0
          git commit -m 'Prevent V102 news AbortError from reaching homepage'
          git push
