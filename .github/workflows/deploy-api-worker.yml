name: Deploy PAIBP API Worker
# redeploy after public payload hardening V126

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/api-worker/**'
      - '.github/workflows/deploy-api-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Require D1 binding for V126+
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '126-d1' cloudflare/api-worker/src/index.js; then
            grep -q '^\[\[d1_databases\]\]' cloudflare/api-worker/wrangler.toml || {
              echo 'D1 binding belum ada. Jalankan Bootstrap PAIBP D1 V126 terlebih dahulu.' >&2
              exit 1
            }
            grep -q 'binding = "DB"' cloudflare/api-worker/wrangler.toml || exit 1
          fi
      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/api-worker
          command: deploy
