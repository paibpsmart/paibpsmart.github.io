name: Hotfix V102 news fetch
on:
  push:
    paths:
      - '.github/workflows/hotfix-v102-news-fetch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace JSONP with fetch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('home-news-v102.js')
          s=p.read_text(encoding='utf-8')
          repl='''async function jsonp(){\n    const u=new URL(GAS);u.searchParams.set("action","publicSnapshot");u.searchParams.set("_",Date.now());\n    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);\n    try{const r=await fetch(u,{cache:"no-store",headers:{"Accept":"application/json"},signal:ctl.signal});const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error("Respons server berita tidak valid.")}if(!r.ok)throw new Error(j?.error||`Server berita HTTP ${r.status}`);return j}finally{clearTimeout(timer)}\n  }\n  const valueData'''
          s,n=re.subn(r'function jsonp\(\)\{.*?\n  const valueData',repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('home jsonp block not found')
          p.write_text(s,encoding='utf-8')

          p=Path('news-editor-chunked-v102.js')
          s=p.read_text(encoding='utf-8')
          repl='''async function jsonpSnapshot(){\n    const u=new URL(GAS);u.searchParams.set("action","publicSnapshot");u.searchParams.set("_",Date.now());\n    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);\n    try{const r=await fetch(u,{cache:"no-store",headers:{"Accept":"application/json"},signal:ctl.signal});const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error("Respons server berita tidak valid.")}if(!r.ok)throw new Error(j?.error||`Server berita HTTP ${r.status}`);return j}finally{clearTimeout(timer)}\n  }\n\n  async function post'''
          s,n=re.subn(r'function jsonpSnapshot\(\)\{.*?\n  async function post',repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('editor snapshot block not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'paibp-smart-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add home-news-v102.js news-editor-chunked-v102.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use Worker JSON fetch for V102 news read and verify'
          git push
